<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Softpay cloud switch test</title>
<style>
  body{font:16px system-ui,sans-serif;margin:0;padding:16px;max-width:560px}
  h1{font-size:20px;margin:0 0 12px}
  label{display:block;margin:10px 0 2px;font-size:13px;color:#444}
  input{width:100%;box-sizing:border-box;padding:10px;font-size:16px}
  button{margin-top:14px;padding:12px 16px;font-size:16px;width:100%}
  pre{background:#111;color:#9f9;padding:10px;white-space:pre-wrap;word-break:break-all;font-size:12px;min-height:120px}
  details{margin-top:12px}
</style>
</head>
<body>
<h1>Softpay cloud switch test</h1>
<p>Creates a Cloud API transaction and switches to the <b>io.softpay.integrationtest</b> app. Credentials stay in this browser only.</p>

<label>Cloud API client id</label><input id="cid" autocomplete="off" autocapitalize="off">
<label>Cloud API client secret</label><input id="sec" type="password" autocomplete="off">
<label>Merchant reference (UUID, the "Merchant" field of the test client)</label><input id="mref" autocomplete="off">
<label>App id (e.g. ABC1234567890)</label><input id="appid" autocomplete="off" autocapitalize="characters">
<button id="getapp" type="button">Get app id from the app (switches there and back)</button>
<label>Amount (minor units)</label><input id="amount" inputmode="numeric" value="100">
<label>Currency</label><input id="cur" value="DKK">

<details><summary>Advanced</summary>
<label>Auth URL</label><input id="authurl" value="https://auth.sandbox.softpay.io/oauth2/token">
<label>API base</label><input id="api" value="https://api.sandbox.softpay.io/api-gateway/v3/api/cloud">
<label>Action</label><input id="action" value="PAYMENT">
<label>Target package</label><input id="pkg" value="io.softpay.integrationtest">
</details>

<button id="pay" type="button">Create transaction and switch</button>
<button id="check" type="button">Check last transaction</button>
<button id="merchants" type="button">List merchants these credentials can act for</button>
<button id="stores" type="button">List stores and app ids visible to these credentials</button>
<pre id="softpay_log"></pre>

<script src="https://assets.softpay.io/cloudswitch/softpay-client/softpay-client-1.6.js"
        integrity="sha384-nkWJjBdISbcVxp/HMOJ618fRVpdr/xf4wTMxR1OSRtvlsuYhdW8Q6nV8cFfJIjxY" crossorigin="anonymous"></script>
<script src="app.js?v=8"></script>
</body>
</html>
